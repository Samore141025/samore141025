    <rect x="30" y="16" width="12" height="12" rx="2.5" class="c-0"/>
    <rect x="30" y="32" width="12" height="12" rx="2.5" class="c-0"/>
    <rect x="30" y="48" width="12" height="12" rx="2.5" class="c-0"/>
    <rect x="30" y="64" width="12" height="12" rx="2.5" class="c-1"/>
    <rect x="30" y="80" width="12" height="12" rx="2.5" class="c-0"/>
    <rect x="30" y="96" width="12" height="12" rx="2.5" class="c-0"/>
    <!-- Random organic commit points around right edge -->
