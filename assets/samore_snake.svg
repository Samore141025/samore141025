    <rect x="765" y="48" width="12" height="12" rx="2.5" class="c-1"/>
    <rect x="780" y="32" width="12" height="12" rx="2.5" class="c-3"/>
    <rect x="780" y="80" width="12" height="12" rx="2.5" class="c-1"/>
