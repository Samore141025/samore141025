    <!-- Snake Head -->
    <rect x="0" y="0" width="12" height="12" rx="3" class="snake-head"/>
    <!-- Eyes -->
    <circle cx="8" cy="3" r="1.8" class="snake-eye"/>
    <circle cx="8" cy="9" r="1.8" class="snake-eye"/>
  </g>

  <!-- Bottom Info Footer -->
  <g transform="translate(25, 205)" class="legend-text">
    <text x="0" y="0" fill="#00ff41">&gt;&gt; REAL-TIME CONTRIBUTION STREAK: ACTIVE</text>
    <text x="350" y="0" fill="#8b949e">GRID PATTERN: [S.A.M.O.R.E. MATRIX PROTOCOL]</text>
