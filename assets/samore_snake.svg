<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="100%" height="230">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700&display=swap');

      .bg { fill: #0a0e17; stroke: #1e293b; stroke-width: 1.5; }
      .header-text { font-family: 'Share Tech Mono', monospace; font-size: 13px; fill: #00f0ff; letter-spacing: 1.5px; font-weight: bold; }
      .legend-text { font-family: 'Share Tech Mono', monospace; font-size: 11px; fill: #c5d1de; }
      
      /* Grid Base Cells */
      .c-empty { fill: #161b22; }
      .c-green-1 { fill: #0e4429; }
      .c-green-2 { fill: #006d32; }
      .c-green-3 { fill: #26a641; }
      .c-green-4 { fill: #39d353; }
      
      /* TIMED EATING & REGENERATION FOR S-A-M-O-R-E LETTERS */
      /* Cycle period: 16 seconds */
      
      /* Letter S (Eaten at ~1s - 3s, Regenerates at ~4s) */
      .letter-s {
        animation: eatS 16s infinite ease-in-out;
      }
      @keyframes eatS {
        0% { fill: #39d353; opacity: 1; filter: drop-shadow(0 0 3px #00ff41); }
        8% { fill: #161b22; opacity: 0.15; filter: none; } /* Eaten! */
        18% { fill: #0e4429; opacity: 0.5; }
        25% { fill: #26a641; opacity: 0.8; }
        32%, 100% { fill: #39d353; opacity: 1; filter: drop-shadow(0 0 4px #00ff41); } /* Reappeared! */
      }

      /* Letter A (Eaten at ~4s - 6s, Regenerates at ~7s) */
      .letter-a {
        animation: eatA 16s infinite ease-in-out;
      }
      @keyframes eatA {
        0%, 18% { fill: #39d353; opacity: 1; filter: drop-shadow(0 0 3px #00ff41); }
        26% { fill: #161b22; opacity: 0.15; filter: none; } /* Eaten! */
        35% { fill: #0e4429; opacity: 0.5; }
        42% { fill: #26a641; opacity: 0.8; }
        50%, 100% { fill: #39d353; opacity: 1; filter: drop-shadow(0 0 4px #00ff41); } /* Reappeared! */
      }

      /* Letter M (Eaten at ~6s - 8s, Regenerates at ~9s) */
      .letter-m {
        animation: eatM 16s infinite ease-in-out;
      }
      @keyframes eatM {
        0%, 35% { fill: #39d353; opacity: 1; filter: drop-shadow(0 0 3px #00ff41); }
        44% { fill: #161b22; opacity: 0.15; filter: none; } /* Eaten! */
        53% { fill: #0e4429; opacity: 0.5; }
        60% { fill: #26a641; opacity: 0.8; }
        68%, 100% { fill: #39d353; opacity: 1; filter: drop-shadow(0 0 4px #00ff41); } /* Reappeared! */
      }

      /* Letter O (Eaten at ~8s - 10s, Regenerates at ~11s) */
      .letter-o {
        animation: eatO 16s infinite ease-in-out;
      }
      @keyframes eatO {
        0%, 52% { fill: #39d353; opacity: 1; filter: drop-shadow(0 0 3px #00ff41); }
        60% { fill: #161b22; opacity: 0.15; filter: none; } /* Eaten! */
        68% { fill: #0e4429; opacity: 0.5; }
        75% { fill: #26a641; opacity: 0.8; }
        82%, 100% { fill: #39d353; opacity: 1; filter: drop-shadow(0 0 4px #00ff41); } /* Reappeared! */
      }

      /* Letter R (Eaten at ~10s - 12s, Regenerates at ~13s) */
      .letter-r {
        animation: eatR 16s infinite ease-in-out;
      }
      @keyframes eatR {
        0%, 68% { fill: #39d353; opacity: 1; filter: drop-shadow(0 0 3px #00ff41); }
        76% { fill: #161b22; opacity: 0.15; filter: none; } /* Eaten! */
        84% { fill: #0e4429; opacity: 0.5; }
        90% { fill: #26a641; opacity: 0.8; }
        96%, 100% { fill: #39d353; opacity: 1; filter: drop-shadow(0 0 4px #00ff41); } /* Reappeared! */
      }

      /* Letter E (Eaten at ~12s - 14s, Regenerates at ~15s) */
      .letter-e {
        animation: eatE 16s infinite ease-in-out;
      }
      @keyframes eatE {
        0%, 82% { fill: #39d353; opacity: 1; filter: drop-shadow(0 0 3px #00ff41); }
        89% { fill: #161b22; opacity: 0.15; filter: none; } /* Eaten! */
        94% { fill: #0e4429; opacity: 0.5; }
        98% { fill: #26a641; opacity: 0.8; }
        100% { fill: #39d353; opacity: 1; filter: drop-shadow(0 0 4px #00ff41); } /* Reappeared! */
      }

      /* Snake Head and Body Glowing */
      .snake-head {
        fill: #00f0ff;
        filter: drop-shadow(0 0 8px #00f0ff);
      }
      .snake-body {
        fill: #39d353;
        filter: drop-shadow(0 0 4px #00ff41);
      }
      .snake-eye {
        fill: #ff0055;
      }
      
      /* Real Arcade Serpentine Path with Discrete Grid Turns */
      #realArcadeSnake {
        animation: realSnakeLogic 16s linear infinite;
      }
      
      @keyframes realSnakeLogic {
        /* Start from Left before S */
        0%   { transform: translate(30px, 60px); }
        /* Down to bottom of S */
        5%   { transform: translate(30px, 156px); }
        /* Right across bottom of S */
        10%  { transform: translate(120px, 156px); }
        /* Up across right of S */
        15%  { transform: translate(120px, 60px); }
        /* Across to Letter A */
        22%  { transform: translate(180px, 60px); }
        /* Down inside A */
        27%  { transform: translate(180px, 156px); }
        /* Up & right towards M */
        35%  { transform: translate(250px, 60px); }
        /* Serpentine through M */
        42%  { transform: translate(330px, 156px); }
        48%  { transform: translate(380px, 60px); }
        /* Into O */
        55%  { transform: translate(450px, 156px); }
        62%  { transform: translate(500px, 60px); }
        /* Into R */
        70%  { transform: translate(570px, 156px); }
        77%  { transform: translate(620px, 60px); }
        /* Into E */
        85%  { transform: translate(700px, 156px); }
        92%  { transform: translate(750px, 60px); }
        /* Loop back to start */
        98%  { transform: translate(840px, 156px); }
        100% { transform: translate(30px, 60px); }
      }
    ]]></style>
  </defs>

