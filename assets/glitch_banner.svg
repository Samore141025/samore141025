<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 280" width="100%" height="280">
  <defs>
    <!-- Linear & Radial Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#091224"/>
      <stop offset="100%" stop-color="#04060c"/>
    </linearGradient>

    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="100%" stop-color="#39d353"/>
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(0, 255, 65, 0.05)" stroke-width="1.5"/>
    </pattern>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;family=Orbitron:wght@700;900&amp;display=swap');

      .bg-rect { fill: url(#bgGrad); stroke: #00ff41; stroke-width: 1.5; }
      .grid-lines { stroke: rgba(0, 240, 255, 0.07); stroke-width: 1; }
      .hud-accent { stroke: #00f0ff; stroke-width: 2; fill: none; }
      
      .status-text {
        font-family: 'Share Tech Mono', monospace;
        font-size: 13px;
        fill: #00ff41;
        letter-spacing: 2px;
      }
      
      .tag-text {
        font-family: 'Share Tech Mono', monospace;
        font-size: 12px;
        fill: #8b949e;
        letter-spacing: 1px;
      }

      /* Animated Name Morphing: SHRIKANT MORE &lt;-&gt; SAMORE */
      .morph-name {
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        font-size: 46px;
        letter-spacing: 4px;
        text-anchor: middle;
      }

      .name-state-1 {
        fill: #00ff41;
        filter: url(#glowGreen);
        animation: cycleName1 8s infinite ease-in-out;
      }

      .name-state-2 {
        fill: #00f0ff;
        filter: url(#glowCyan);
        animation: cycleName2 8s infinite ease-in-out;
      }

      .glitch-slice {
        animation: glitchShake 8s infinite ease-in-out;
      }

      @keyframes cycleName1 {
        0%, 42% { opacity: 1; transform: translateY(0); }
        45%, 48% { opacity: 0.3; transform: translate(3px, -2px) skewX(10deg); }
        50%, 92% { opacity: 0; transform: translateY(10px); }
        95%, 98% { opacity: 0.4; transform: translate(-3px, 2px) skewX(-8deg); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @keyframes cycleName2 {
        0%, 45% { opacity: 0; transform: translateY(-10px); }
        48%, 51% { opacity: 0.5; transform: translate(-3px, 2px) skewX(-10deg); }
        53%, 92% { opacity: 1; transform: translateY(0); }
        95%, 98% { opacity: 0.3; transform: translate(3px, -2px) skewX(8deg); }
        100% { opacity: 0; transform: translateY(-10px); }
      }

      @keyframes glitchShake {
        0%, 43%, 52%, 93%, 100% { opacity: 0; transform: translateX(0); }
        44%, 47% { opacity: 0.8; transform: translateX(-4px) skewX(15deg); }
        94%, 97% { opacity: 0.8; transform: translateX(4px) skewX(-15deg); }
      }

      /* Acronym Banner Cycle */
      .acronym-text {
        font-family: 'Share Tech Mono', monospace;
        font-size: 13.5px;
        letter-spacing: 2px;
        text-anchor: middle;
        fill: #00f0ff;
        animation: pulseAcronym 4s infinite alternate;
      }

      @keyframes pulseAcronym {
        0% { opacity: 0.75; fill: #00f0ff; }
        100% { opacity: 1; fill: #39d353; filter: url(#glowGreen); }
      }

      /* Radar Sweep */
      .radar-sweep {
        transform-origin: 900px 50px;
        animation: sweep 4s linear infinite;
      }
      @keyframes sweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect class="bg-rect" x="5" y="5" width="940" height="270" rx="10"/>
  <rect x="5" y="5" width="940" height="270" rx="10" fill="url(#scanlines)" pointer-events="none"/>

  <!-- Cyber Grid Background Lines -->
  <g class="grid-lines">
    <line x1="30" y1="45" x2="920" y2="45"/>
    <line x1="30" y1="235" x2="920" y2="235"/>
    <line x1="180" y1="5" x2="180" y2="275"/>
    <line x1="770" y1="5" x2="770" y2="275"/>
  </g>

  <!-- HUD Corner Angles -->
  <path class="hud-accent" d="M 15 35 L 15 15 L 35 15"/>
  <path class="hud-accent" d="M 935 35 L 935 15 L 915 15"/>
  <path class="hud-accent" d="M 15 245 L 15 265 L 35 265"/>
  <path class="hud-accent" d="M 935 245 L 935 265 L 915 265"/>

  <!-- Top Status Bar -->
  <text x="35" y="32" class="status-text">
    <tspan fill="#ff0055">●</tspan> SECURE PROTOCOL // CLASSIFIED LEVEL 5 // STATUS: ONLINE
  </text>
  <text x="915" y="32" class="status-text" text-anchor="end">
    SYS_ID: 141025-SHUGO
  </text>

  <!-- Center Decorative Hex Crosshairs -->
  <circle cx="475" cy="115" r="75" stroke="rgba(0,255,65,0.12)" stroke-width="1" fill="none"/>
  <circle cx="475" cy="115" r="95" stroke="rgba(0,240,255,0.08)" stroke-width="1" stroke-dasharray="6,4" fill="none"/>

  <!-- Glitch Shadow Artifacts -->
  <g class="glitch-slice">
    <text x="475" y="125" class="morph-name" fill="#ff0055">S H R I K A N T   M O R E</text>
  </g>

  <!-- Morphing Main Identity -->
  <!-- State 1: SHRIKANT MORE -->
  <text x="475" y="125" class="morph-name name-state-1">
    SHRIKANT MORE
  </text>

  <!-- State 2: SAMORE -->
  <text x="475" y="125" class="morph-name name-state-2">
    ⚡ S A M O R E ⚡
  </text>

  <!-- Decoded Moniker Matrix -->
  <text x="475" y="172" class="acronym-text">
    [ S ] Sustainable • [ A ] Automation • [ M ] Manufacturing • [ O ] Optimization • [ R ] Research • [ E ] Expansion
  </text>

  <!-- Bottom Badges / Roles -->
  <g transform="translate(0, 205)">
    <text x="475" y="0" class="tag-text" text-anchor="middle" fill="#58a6ff">
      AI/ML SPECIALIST • CYBER THREAT INTELLIGENCE (CTI/CTH) • CERTIFIED ETHICAL HACKER (CEH)
    </text>
    <text x="475" y="20" class="status-text" text-anchor="middle" font-size="11.5px">
      [ OPENSHIFT AI • TENSORFLOW • SHUGO DEFENSE • SATELLITE VISION • MULTI-AGENT ARCHITECTURE ]
    </text>
  </g>

  <!-- Small Radar Widget in Top Right -->
  <g transform="translate(860, 20)">
    <circle cx="25" cy="20" r="16" stroke="#00ff41" stroke-width="0.8" fill="none" opacity="0.4"/>
    <circle cx="25" cy="20" r="8" stroke="#00ff41" stroke-width="0.8" fill="none" opacity="0.3"/>
    <line x1="25" y1="4" x2="25" y2="36" stroke="#00ff41" stroke-width="0.6" opacity="0.4"/>
    <line x1="9" y1="20" x2="41" y2="20" stroke="#00ff41" stroke-width="0.6" opacity="0.4"/>
    <g class="radar-sweep" style="transform-origin: 25px 20px;">
      <line x1="25" y1="20" x2="25" y2="4" stroke="#00ff41" stroke-width="1.5" opacity="0.9"/>
    </g>
  </g>

  <!-- Left Side Data Blocks -->
  <g transform="translate(35, 75)" class="tag-text" font-size="10.5px">
    <text x="0" y="0" fill="#00ff41">&gt; INITIALIZING AGENT...</text>
    <text x="0" y="16" fill="#8b949e">&gt; NODE: EDUSKILLS / NMIET</text>
    <text x="0" y="32" fill="#8b949e">&gt; SEC_AUTH: GRANTED [0x7F]</text>
    <text x="0" y="48" fill="#00f0ff">&gt; AI_CORE: STANDBY</text>
  </g>

  <!-- Right Side Data Blocks -->
  <g transform="translate(735, 75)" class="tag-text" font-size="10.5px">
    <text x="0" y="0" fill="#00f0ff">&gt; DEFENSE: SHUGO-SHIELD</text>
    <text x="0" y="16" fill="#8b949e">&gt; THREAT_HUNT: ACTIVE</text>
    <text x="0" y="32" fill="#8b949e">&gt; GENAI_APAC: BELLATRIX</text>
    <text x="0" y="48" fill="#00ff41">&gt; PORTAL_LINK: READY</text>
  </g>
</svg>
